<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>YSJ Newsroom</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
}


/* HEADER */

header {
    height: 60px;
    background: #222;

    display: flex;
    align-items: center;

    padding: 0 20px;

    font-size: 26px;
    font-weight: bold;
}


/* MAIN GRID */

main {

    display: grid;

    grid-template-columns: 1fr 1fr;

    grid-template-rows:
        1fr
        1fr
        1fr
        1fr;

    grid-template-areas:

        "sky weather"

        "sky clocks"

        "local bbc"

        "radio bbc";

    gap: 10px;

    padding: 10px;

    height: calc(100vh - 60px);
}


/* PANELS */

.panel {

    background: #222;

    border-radius: 5px;

    overflow: hidden;

    min-height: 0;
}


.panel-title {

    height: 38px;

    padding: 9px 12px;

    font-size: 16px;

    font-weight: bold;

    background: #333;
}


/* GRID AREAS */

.sky-panel {
    grid-area: sky;
}

.weather-panel {
    grid-area: weather;
}

.clocks-panel {
    grid-area: clocks;
}

.local-panel {
    grid-area: local;
}

.radio-panel {
    grid-area: radio;
}

.bbc-panel {
    grid-area: bbc;
}


/* SKY NEWS */

.sky-frame {

    display: block;

    width: 100%;

    height: calc(100% - 38px);

    border: 0;
}


/* BBC NEWS */

.bbc-video {

    display: block;

    width: 100%;

    height: calc(100% - 38px);

    object-fit: contain;

    background: #000;
}


/* PLACEHOLDERS */

.placeholder {

    height: calc(100% - 38px);

    display: flex;

    align-items: center;

    justify-content: center;

    color: #888;

    font-size: 22px;
}


/* RADIO */

.radio-container {

    height: calc(100% - 38px);

    background: #111;
}


.radio-container select {

    width: 100%;

    height: 45px;

    background: #333;

    color: white;

    border: 0;

    padding: 0 12px;

    font-size: 16px;
}


.radio-player {

    width: 100%;

    height: calc(100% - 45px);

    border: 0;

    display: block;

}

</style>

</head>


<body>


<header>
    YSJ NEWSROOM
</header>


<main>


    <!-- SKY NEWS -->

    <section class="panel sky-panel">

        <div class="panel-title">
            SKY NEWS — LIVE
        </div>

        <iframe
            class="sky-frame"
            src="https://www.youtube.com/embed/xDWQ3LkccY8?si=4BnLGTU_oWMt_jeO"
            title="Sky News"
            frameborder="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            referrerpolicy="strict-origin-when-cross-origin"
            allowfullscreen>
        </iframe>

    </section>



    <!-- YORK WEATHER -->

    <section class="panel weather-panel">

        <div class="panel-title">
            YORK WEATHER
        </div>

        <div class="placeholder">
            WEATHER
        </div>

    </section>



    <!-- WORLD CLOCKS -->

    <section class="panel clocks-panel">

        <div class="panel-title">
            WORLD CLOCKS
        </div>

        <div class="placeholder">
            CLOCKS
        </div>

    </section>



    <!-- BBC LOCAL -->

    <section class="panel local-panel">

        <div class="panel-title">
            BBC LOCAL — YORK & NORTH YORKSHIRE
        </div>

        <div class="placeholder">
            BBC LOCAL NEWS
        </div>

    </section>

    <!-- RADIO -->

<section class="panel radio-panel">

    <div class="panel-title">
        RADIO
    </div>

    <div class="radio-container">

        <select id="radioStation" onchange="changeRadio()">

            <option value="bbc-york">
                BBC Radio York
            </option>

            <option value="bbc-5live">
                BBC Radio 5 Live
            </option>

            <option value="yorkmix">
                YorkMix Radio
            </option>

        </select>


        <audio
            id="radioPlayer"
            controls
            preload="none">

        </audio>

    </div>

</section>

    



    <!-- BBC NEWS -->

    <section class="panel bbc-panel">

        <div class="panel-title">
            BBC NEWS — LIVE
        </div>

        <video
            id="bbc-video"
            class="bbc-video"
            controls
            autoplay
            muted
            playsinline>
        </video>

    </section>


</main>



<!-- HLS.JS -->

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.7.3/dist/hls.min.js"></script>


<script>

/* =========================================
   BBC NEWS LIVE
   ========================================= */

const video = document.getElementById('bbc-video');

const streamUrl =
    'https://vs-hls-push-ww.live.fastly.md.bbci.co.uk/x=4/i=urn:bbc:pips:service:bbc_news_channel_hd/t=3840/v=pv14/b=5070016/main.m3u8';


if (Hls.isSupported()) {

    const hls = new Hls();

    hls.loadSource(streamUrl);

    hls.attachMedia(video);

}
else if (
    video.canPlayType('application/vnd.apple.mpegurl')
) {

    video.src = streamUrl;

}



/* =========================================
   RADIO SELECTOR
   ========================================= */

function changeRadio() {

    const station =
        document.getElementById('radioStation');

    const player =
        document.getElementById('radioPlayer');


    if (station.value === 'yorkmix') {

        player.src =
            'https://www.yorkmix.com/radio';

    }


    else if (station.value === 'bbc-york') {

        player.src =
            'https://www.bbc.co.uk/sounds/play/live:bbc_radio_york';

    }


    else if (station.value === 'bbc-5live') {

        player.src =
            'https://www.bbc.co.uk/sounds/play/live:bbc_5live';

    }

}

</script>


</body>

</html>
