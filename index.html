<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YSJ Newsroom Test</title>

<style>
    * { box-sizing: border-box; }

    body {
        margin: 0;
        background: #111;
        color: white;
        font-family: Arial, sans-serif;
    }

    header {
        height: 70px;
        background: #222;
        display: flex;
        align-items: center;
        padding: 0 25px;
        font-size: 28px;
        font-weight: bold;
    }

    main {
        display: grid;
        grid-template-columns: 2fr 1fr;
        gap: 15px;
        padding: 15px;
        height: calc(100vh - 70px);
    }

    .panel {
        background: #222;
        border-radius: 6px;
        overflow: hidden;
    }

    .panel-title {
        padding: 10px 15px;
        font-size: 18px;
        font-weight: bold;
        background: #333;
    }

    iframe {
        width: 100%;
        border: 0;
    }

    .video {
        height: calc(100% - 45px);
    }

    .weather {
        padding: 20px;
        font-size: 20px;
    }

    .weather h2 {
        margin-top: 0;
    }
</style>
</head>

<body>

<header>YSJ NEWSROOM</header>

<main>

    <section class="panel">
        <div class="panel-title">SKY NEWS — LIVE TEST</div>

        <iframe width="560" height="315" 
         src="https://www.youtube.com/embed/xDWQ3LkccY8?si=4BnLGTU_oWMt_jeO"
         title="YouTube video player"
         frameborder="0"
         allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
         referrerpolicy="strict-origin-when-cross-origin"
         allowfullscreen></iframe>
    </section>

    <section class="panel">
    <div class="panel-title">BBC NEWS — LIVE TEST</div>

    <video
        id="bbc-video"
        controls
        autoplay
        muted
        playsinline
        style="width:100%; height:100%; object-fit:contain; background:#000;">
    </video>
</section>

</main>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.7.3/dist/hls.min.js"></script>

<script>
const video = document.getElementById('bbc-video');

const streamUrl =
  'https://vs-hls-push-ww.live.fastly.md.bbci.co.uk/x=4/i=urn:bbc:pips:service:bbc_news_channel_hd/t=3840/v=pv14/b=5070016/main.m3u8';

if (Hls.isSupported()) {
    const hls = new Hls();
    hls.loadSource(streamUrl);
    hls.attachMedia(video);
} else if (video.canPlayType('application/vnd.apple.mpegurl')) {
    video.src = streamUrl;
}
</script>
</body>
</html>
