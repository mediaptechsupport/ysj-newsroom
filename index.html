<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>YSJ Newsroom</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
}


/* HEADER */

header {
    height: 60px;
    background: #222;
    display: flex;
    align-items: center;
    padding: 0 20px;
    font-size: 26px;
    font-weight: bold;
}


/* MAIN GRID */

main {
    display: grid;

    grid-template-columns: 1fr 1fr;

    grid-template-rows:
        1.25fr
        0.75fr
        1fr
        1fr;

    grid-template-areas:
        "sky weather"
        "sky clocks"
        "local bbc"
        "radio bbc";

    gap: 10px;

    padding: 10px;

    height: calc(100vh - 60px);
}


/* PANELS */

.panel {
    background: #222;
    border-radius: 5px;
    overflow: hidden;
    min-height: 0;
}

.panel-title {
    height: 38px;
    padding: 9px 12px;
    font-size: 16px;
    font-weight: bold;
    background: #333;
}


/* GRID AREAS */

.sky-panel {
    grid-area: sky;
}

.weather-panel {
    grid-area: weather;
}

.clocks-panel {
    grid-area: clocks;
}

.local-panel {
    grid-area: local;
}

.radio-panel {
    grid-area: radio;
}

.bbc-panel {
    grid-area: bbc;
}


/* SKY NEWS */

.sky-frame {
    display: block;
    width: 100%;
    height: calc(100% - 38px);
    border: 0;
}


/* BBC NEWS */

.bbc-video {
    display: block;
    width: 100%;
    height: calc(100% - 38px);
    object-fit: contain;
    background: #000;
}


/* =====================================================
   WEATHER
   ===================================================== */

.weather-content {
    height: auto;
    min-height: 0;
    padding: 8px 10px;
    background:
        linear-gradient(
            135deg,
            #182c3a 0%,
            #23485b 50%,
            #111 100%
        );
    position: relative;
    overflow: visible;
}

.weather-content::after {
    content: "";
    position: absolute;
    width: 130px;
    height: 130px;
    border-radius: 50%;
    background: rgba(255,255,255,0.04);
    right: -40px;
    top: -60px;
}


/* MAIN WEATHER */

.weather-main {
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: relative;
    z-index: 1;
    height: 62px;
}

.weather-left {
    display: flex;
    align-items: center;
    gap: 8px;
}

.weather-icon {
    font-size: 48px;
    line-height: 1;
}

.weather-temp {
    font-size: 40px;
    font-weight: bold;
    line-height: 1;
}

.weather-condition {
    font-size: 12px;
    color: #d5dfe4;
    margin-top: 3px;
}

.weather-details {
    text-align: right;
    font-size: 12px;
    color: #d5dfe4;
    line-height: 1.35;
}

.weather-details strong {
    color: white;
}


/* FOUR QUICK STATS */

.weather-strip {
    margin-top: 6px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 4px;
    position: relative;
    z-index: 1;
}

.weather-stat {
    background: rgba(0,0,0,0.28);
    border-radius: 4px;
    padding: 4px 3px;
    text-align: center;
}

.weather-stat-label {
    font-size: 8px;
    text-transform: uppercase;
    color: #aebfc8;
    letter-spacing: 0.3px;
}

.weather-stat-value {
    font-size: 11px;
    font-weight: bold;
    margin-top: 1px;
}


/* FOUR DAY FORECAST */

.weather-forecast {
    margin-top: 5px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 4px;
    position: relative;
    z-index: 1;
}

.weather-day {
    background: rgba(0,0,0,0.32);
    border-radius: 4px;
    padding: 3px;
    text-align: center;
    font-size: 9px;
    line-height: 1.05;
}

.weather-day-name {
    font-weight: bold;
    margin-bottom: 1px;
    font-size: 9px;
}

.weather-day-icon {
    font-size: 16px;
    line-height: 1;
}

.weather-day-temp {
    margin-top: 2px;
    font-weight: bold;
    font-size: 10px;
}

.weather-day-rain {
    color: #a9d5ed;
    font-size: 8px;
    margin-top: 1px;
}


/* ERROR / LOADING */

.weather-status {
    text-align: center;
    color: #aaa;
    padding-top: 20px;
    font-size: 12px;
}


/* =====================================================
   CLOCKS
   ===================================================== */

.clocks-content {
    height: calc(100% - 38px);
    padding: 10px;
    background: #111;

    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
}

.clock {
    background: #222;
    border-radius: 4px;
    padding: 8px 12px;

    display: flex;
    align-items: center;
    justify-content: space-between;
}

.clock-city {
    font-size: 15px;
    font-weight: bold;
}

.clock-time {
    font-size: 20px;
    font-weight: bold;
    font-variant-numeric: tabular-nums;
}


/* =====================================================
   BBC LOCAL NEWS
   ===================================================== */

.local-content {
    height: calc(100% - 38px);
    background: #111;
    overflow-y: auto;
}

.news-item {
    padding: 8px 12px;
    border-bottom: 1px solid #333;
    transition: background 0.15s;
}

.news-item:hover {
    background: #292929;
}

.news-item a {
    color: white;
    text-decoration: none;
    font-size: 15px;
    line-height: 1.25;
    display: block;
}

.news-item a:hover {
    text-decoration: underline;
}

.news-date {
    color: #777;
    font-size: 11px;
    margin-top: 4px;
}

.news-status {
    color: #777;
    text-align: center;
    padding: 25px 10px;
}


/* =====================================================
   RADIO
   ===================================================== */

.radio-container {
    height: calc(100% - 38px);
    background: #111;
    padding: 12px;
}

.radio-container select {
    width: 100%;
    height: 42px;

    background: #333;
    color: white;

    border: 1px solid #555;

    padding: 0 12px;

    font-size: 16px;
}

.radio-message {
    text-align: center;
    color: #777;
    margin-top: 25px;
    font-size: 16px;
}


/* SCROLLBAR */

.local-content::-webkit-scrollbar {
    width: 7px;
}

.local-content::-webkit-scrollbar-track {
    background: #181818;
}

.local-content::-webkit-scrollbar-thumb {
    background: #444;
    border-radius: 4px;
}

</style>

</head>


<body>


<header>
    YSJ NEWSROOM
</header>


<main>


    <!-- =================================================
         SKY NEWS
         ================================================= -->

    <section class="panel sky-panel">

        <div class="panel-title">
            SKY NEWS — LIVE
        </div>

        <iframe
            class="sky-frame"
            src="https://www.youtube.com/embed/xDWQ3LkccY8?si=4BnLGTU_oWMt_jeO"
            title="Sky News"
            frameborder="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            referrerpolicy="strict-origin-when-cross-origin"
            allowfullscreen>
        </iframe>

    </section>



    <!-- =================================================
         YORK WEATHER
         ================================================= -->

    <section class="panel weather-panel">

        <div class="panel-title">
            YORK WEATHER
        </div>

        <div class="weather-content">

            <div id="weather-main">

                <div class="weather-status">
                    Loading weather...
                </div>

            </div>

            <div id="weather-forecast"
                 class="weather-forecast">
            </div>

        </div>

    </section>



    <!-- =================================================
         WORLD CLOCKS
         ================================================= -->

    <section class="panel clocks-panel">

        <div class="panel-title">
            WORLD CLOCKS
        </div>

        <div class="clocks-content">

            <div class="clock">
                <div class="clock-city">
                    London
                </div>

                <div id="clock-london"
                     class="clock-time">
                    --:--:--
                </div>
            </div>


            <div class="clock">
                <div class="clock-city">
                    Paris
                </div>

                <div id="clock-paris"
                     class="clock-time">
                    --:--:--
                </div>
            </div>


            <div class="clock">
                <div class="clock-city">
                    Washington D.C.
                </div>

                <div id="clock-washington"
                     class="clock-time">
                    --:--:--
                </div>
            </div>


            <div class="clock">
                <div class="clock-city">
                    Sydney
                </div>

                <div id="clock-sydney"
                     class="clock-time">
                    --:--:--
                </div>
            </div>

        </div>

    </section>



    <!-- =================================================
         BBC LOCAL
         ================================================= -->

    <section class="panel local-panel">

        <div class="panel-title">
            BBC LOCAL — YORK & NORTH YORKSHIRE
        </div>

        <div id="local-news"
             class="local-content">

            <div class="news-status">
                Loading BBC local news...
            </div>

        </div>

    </section>



    <!-- =================================================
         RADIO
         ================================================= -->

    <section class="panel radio-panel">

        <div class="panel-title">
            RADIO
        </div>

        <div class="radio-container">

            <select id="radioStation">

                <option>
                    BBC Radio York
                </option>

                <option>
                    BBC Radio 5 Live
                </option>

                <option>
                    YorkMix Radio
                </option>

            </select>

            <div class="radio-message">
                Radio player — coming next
            </div>

        </div>

    </section>



    <!-- =================================================
         BBC NEWS
         ================================================= -->

    <section class="panel bbc-panel">

        <div class="panel-title">
            BBC NEWS — LIVE
        </div>

        <video
            id="bbc-video"
            class="bbc-video"
            controls
            autoplay
            muted
            playsinline>
        </video>

    </section>


</main>



<!-- HLS.JS -->

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.7.3/dist/hls.min.js"></script>


<script>


/* =====================================================
   BBC NEWS LIVE

   DO NOT MODIFY THIS SECTION.
   ===================================================== */

const video =
    document.getElementById('bbc-video');


const streamUrl =
    'https://vs-hls-push-ww.live.fastly.md.bbci.co.uk/x=4/i=urn:bbc:pips:service:bbc_news_channel_hd/t=3840/v=pv14/b=5070016/main.m3u8';


if (Hls.isSupported()) {

    const hls = new Hls();

    hls.loadSource(streamUrl);

    hls.attachMedia(video);

}
else if (
    video.canPlayType('application/vnd.apple.mpegurl')
) {

    video.src = streamUrl;

}


/* =====================================================
   WORLD CLOCKS
   ===================================================== */

function updateClocks() {

    const clocks = {

        'clock-london':
            'Europe/London',

        'clock-paris':
            'Europe/Paris',

        'clock-washington':
            'America/New_York',

        'clock-sydney':
            'Australia/Sydney'

    };


    const now = new Date();


    Object.entries(clocks).forEach(
        ([id, timezone]) => {

            const element =
                document.getElementById(id);


            element.textContent =
                new Intl.DateTimeFormat(
                    'en-GB',
                    {
                        timeZone: timezone,
                        hour: '2-digit',
                        minute: '2-digit',
                        second: '2-digit',
                        hour12: false
                    }
                ).format(now);

        }
    );

}


updateClocks();

setInterval(
    updateClocks,
    1000
);


/* =====================================================
   WEATHER
   YORK
   ===================================================== */

const yorkLatitude = 53.9599;

const yorkLongitude = -1.0873;


function weatherDescription(code) {

    const descriptions = {

        0: 'Clear sky',

        1: 'Mainly clear',

        2: 'Partly cloudy',

        3: 'Overcast',

        45: 'Fog',

        48: 'Freezing fog',

        51: 'Light drizzle',

        53: 'Drizzle',

        55: 'Heavy drizzle',

        61: 'Light rain',

        63: 'Rain',

        65: 'Heavy rain',

        71: 'Light snow',

        73: 'Snow',

        75: 'Heavy snow',

        80: 'Rain showers',

        81: 'Rain showers',

        82: 'Heavy rain showers',

        95: 'Thunderstorm',

        96: 'Thunderstorm',

        99: 'Thunderstorm'

    };


    return descriptions[code]
        || 'Unknown conditions';

}


function weatherIcon(code, isDay = true) {

    if (!isDay) {

        if (code === 0) return '🌙';

        if (code <= 3) return '☁️';

    }


    if (code === 0) return '☀️';

    if (code === 1) return '🌤️';

    if (code === 2) return '⛅';

    if (code === 3) return '☁️';

    if (code === 45 || code === 48) return '🌫️';

    if (code >= 51 && code <= 55) return '🌦️';

    if (code >= 61 && code <= 65) return '🌧️';

    if (code >= 71 && code <= 75) return '🌨️';

    if (code >= 80 && code <= 82) return '🌦️';

    if (code >= 95) return '⛈️';

    return '🌤️';

}


function shortDayName(dateString, index) {

    if (index === 0) {
        return 'TODAY';
    }


    const date =
        new Date(dateString + 'T12:00:00');


    return date
        .toLocaleDateString(
            'en-GB',
            {
                weekday: 'short'
            }
        )
        .toUpperCase();

}


function formatTime(dateString) {

    if (!dateString) {
        return '--:--';
    }


    const date =
        new Date(dateString);


    return date.toLocaleTimeString(
        'en-GB',
        {
            hour: '2-digit',
            minute: '2-digit'
        }
    );

}


async function loadWeather() {

    const main =
        document.getElementById(
            'weather-main'
        );


    const forecast =
        document.getElementById(
            'weather-forecast'
        );


    try {

        const url =
            'https://api.open-meteo.com/v1/forecast' +

            '?latitude=' +
            yorkLatitude +

            '&longitude=' +
            yorkLongitude +

            '&current=' +
            'temperature_2m,' +
            'apparent_temperature,' +
            'weather_code,' +
            'wind_speed_10m,' +
            'precipitation,' +
            'is_day' +

            '&daily=' +
            'temperature_2m_max,' +
            'temperature_2m_min,' +
            'weather_code,' +
            'precipitation_probability_max,' +
            'sunrise,' +
            'sunset' +

            '&forecast_days=4' +

            '&timezone=Europe%2FLondon';


        const response =
            await fetch(url);


        if (!response.ok) {
            throw new Error(
                'Weather request failed'
            );
        }


        const data =
            await response.json();


        const current =
            data.current;


        const daily =
            data.daily;


        const icon =
            weatherIcon(
                current.weather_code,
                current.is_day === 1
            );


        main.innerHTML = `

            <div class="weather-main">

                <div class="weather-left">

                    <div class="weather-icon">
                        ${icon}
                    </div>

                    <div>

                        <div class="weather-temp">
                            ${Math.round(
                                current.temperature_2m
                            )}°C
                        </div>

                        <div class="weather-condition">
                            ${weatherDescription(
                                current.weather_code
                            )}
                        </div>

                    </div>

                </div>


                <div class="weather-details">

                    <strong>
                        H ${Math.round(
                            daily.temperature_2m_max[0]
                        )}°
                    </strong>

                    &nbsp;

                    <strong>
                        L ${Math.round(
                            daily.temperature_2m_min[0]
                        )}°
                    </strong>

                    <br>

                    Feels like
                    ${Math.round(
                        current.apparent_temperature
                    )}°

                </div>

            </div>


            <div class="weather-strip">

                <div class="weather-stat">

                    <div class="weather-stat-label">
                        Wind
                    </div>

                    <div class="weather-stat-value">
                        ${Math.round(
                            current.wind_speed_10m
                        )} km/h
                    </div>

                </div>


                <div class="weather-stat">

                    <div class="weather-stat-label">
                        Rain
                    </div>

                    <div class="weather-stat-value">
                        ${Math.round(
                            daily.precipitation_probability_max[0]
                        )}%
                    </div>

                </div>


                <div class="weather-stat">

                    <div class="weather-stat-label">
                        Sunrise
                    </div>

                    <div class="weather-stat-value">
                        ${formatTime(
                            daily.sunrise[0]
                        )}
                    </div>

                </div>


                <div class="weather-stat">

                    <div class="weather-stat-label">
                        Sunset
                    </div>

                    <div class="weather-stat-value">
                        ${formatTime(
                            daily.sunset[0]
                        )}
                    </div>

                </div>

            </div>

        `;


        forecast.innerHTML = '';


        for (
            let i = 0;
            i < 4;
            i++
        ) {

            const forecastIcon =
                weatherIcon(
                    daily.weather_code[i],
                    true
                );


            forecast.innerHTML += `

                <div class="weather-day">

                    <div class="weather-day-name">
                        ${shortDayName(
                            daily.time[i],
                            i
                        )}
                    </div>

                    <div class="weather-day-icon">
                        ${forecastIcon}
                    </div>

                    <div class="weather-day-temp">

                        ${Math.round(
                            daily.temperature_2m_max[i]
                        )}°

                        /

                        ${Math.round(
                            daily.temperature_2m_min[i]
                        )}°

                    </div>

                    <div class="weather-day-rain">

                        💧
                        ${Math.round(
                            daily.precipitation_probability_max[i]
                        )}%

                    </div>

                </div>

            `;

        }


    }
    catch (error) {

        main.innerHTML = `

            <div class="weather-status">

                Weather unavailable

            </div>

        `;


        forecast.innerHTML = '';


        console.error(
            'Weather error:',
            error
        );

    }

}


loadWeather();


/* Refresh weather every 10 minutes */

setInterval(
    loadWeather,
    10 * 60 * 1000
);


/* =====================================================
   BBC LOCAL NEWS

   BBC North Yorkshire RSS -> RSS2JSON
   ===================================================== */

const bbcFeed =
    'https://feeds.bbci.co.uk/news/england/north_yorkshire/rss.xml';


async function loadLocalNews() {

    const container =
        document.getElementById(
            'local-news'
        );


    try {

        const apiUrl =
            'https://api.rss2json.com/v1/api.json?rss_url='
            +
            encodeURIComponent(
                bbcFeed
            );


        const response =
            await fetch(apiUrl);


        if (!response.ok) {

            throw new Error(
                'RSS2JSON request failed'
            );

        }


        const data =
            await response.json();


        if (
            data.status !== 'ok'
            ||
            !data.items
            ||
            !data.items.length
        ) {

            throw new Error(
                'No BBC stories found'
            );

        }


        container.innerHTML = '';


        data.items
            .slice(0, 8)
            .forEach(item => {


                let dateText = '';


                if (item.pubDate) {

                    const date =
                        new Date(
                            item.pubDate
                        );


                    if (!isNaN(date)) {

                        dateText =
                            date.toLocaleString(
                                'en-GB',
                                {
                                    day: 'numeric',
                                    month: 'short',
                                    hour: '2-digit',
                                    minute: '2-digit'
                                }
                            );

                    }

                }


                const newsItem =
                    document.createElement(
                        'div'
                    );


                newsItem.className =
                    'news-item';


                const link =
                    document.createElement(
                        'a'
                    );


                link.href =
                    item.link;


                link.target =
                    '_blank';


                link.rel =
                    'noopener noreferrer';


                link.textContent =
                    item.title;


                newsItem.appendChild(
                    link
                );


                if (dateText) {

                    const dateElement =
                        document.createElement(
                            'div'
                        );


                    dateElement.className =
                        'news-date';


                    dateElement.textContent =
                        dateText;


                    newsItem.appendChild(
                        dateElement
                    );

                }


                container.appendChild(
                    newsItem
                );

            });


    }
    catch (error) {

        container.innerHTML = `

            <div class="news-status">

                BBC local news unavailable

                <br><br>

                <small>
                    The news feed is temporarily unavailable.
                </small>

            </div>

        `;


        console.error(
            'BBC local news error:',
            error
        );

    }

}


loadLocalNews();


/* Refresh local headlines every 10 minutes */

setInterval(
    loadLocalNews,
    10 * 60 * 1000
);


</script>


</body>

</html>
